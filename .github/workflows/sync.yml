name: 同步影视源

on:
  schedule:
    # 每天北京时间 08:10 跑一次（UTC 00:10）
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 抓上游并清洗
        run: python3 sync_tvbox.py

      - name: 有变化就提交
        run: |
          if git diff --quiet --exit-code; then
            echo "上游没有变化，跳过提交"
            exit 0
          fi
          git config user.name "tvbox-mirror-bot"
          git config user.email "tvbox-mirror-bot@users.noreply.github.com"
          git add tvbox.json removed.txt
          git commit -m "sync: $(date -u '+%Y-%m-%d %H:%M UTC') 上游配置更新（已去推广）"
          git push
